[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amsa-ga"
version = "0.1.0b0"
description = "Clifford algebra library with primitives for robotics, engineering, and science."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "Surya Sunkara" },
]
keywords = ["clifford", "geometric-algebra", "robotics", "pga", "multivector"]

dependencies = [
  "numpy>=1.26",
  "typing-extensions>=4.12",
]


classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Mathematics",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/sunkmechie/AMSA"
Repository = "https://github.com/sunkmechie/AMSA"
Issues = "https://github.com/sunkmechie/AMSA/issues"



[project.optional-dependencies]
# --- Visualization Tools ---
viz = [
  "matplotlib>=3.10.8",
  "vispy>=0.14",
  "glfw"
]

# --- JAX Support ---
jax = [
  "jax>=0.4.30",
]

# --- Core/Acceleration Tools (Triton) ---
accel = [
  "triton>=3.0",
]

# --- Development & Research Tools ---
dev = [
  "mypy>=1.10",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "sphinx>=7.0",
  "myst-nb>=1.0",
]

bench = [
  "pytest-benchmark>=4.0",
]

[tool.uv]
default-groups = []

[tool.hatch.build.targets.wheel]
packages = ["src/amsa"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
packages = ["amsa"]
strict = true
mypy_path = ["src"]
